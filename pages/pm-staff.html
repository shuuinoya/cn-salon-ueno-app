<style>
  /* スタッフ紹介（【スタッフ】タブ）。見た目は予約サイトのほかのページと同じ部品（白いカード・金色のボタン）を使う。
     写真は管理画面の「スタッフ情報」で登録したもの。端末の幅に合わせて、パソコン3列・スマホ2列で写真を大きく並べる */
  .st-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 16px; }
  .st-item { display: flex; flex-direction: column; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .st-photo { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; padding: 0; background: #f6efe4; border: 0; overflow: hidden; cursor: pointer; }
  .st-photo:focus-visible { outline: 2px solid #946328; outline-offset: -2px; }
  .st-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .st-photo svg { position: absolute; inset: 0; margin: auto; width: 46%; height: 46%; fill: #dcc69f; }
  .st-body { display: flex; flex: 1; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 12px 14px; }
  .st-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .st-name { margin: 0; color: var(--text); font-size: 18px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
  .st-gender { color: #6b7280; font-size: 12px; }
  .st-fee { margin: 0; color: #8a6420; font-size: 14px; line-height: 1.4; }
  .st-fee b { font-size: 16px; }
  .st-msg { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; margin: 4px 0 0; color: #4b5563; font-size: 13px; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }
  .st-more { align-self: flex-start; padding: 0; border: 0; background: none; color: #8a6420; font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .st-more[hidden] { display: none; }
  .st-actions { margin-top: auto; padding-top: 8px; }
  .booking-button.st-book { width: 100%; min-width: 0; }
  .st-status { margin: 0; padding: 28px 16px; color: #6b7280; text-align: center; line-height: 1.8; }
  .st-status button { margin-left: 6px; padding: 5px 12px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; font: inherit; cursor: pointer; }
  /* 「続きを読む」・写真を押したとき：その人の情報を画面の真ん中に小さめに出す（カードは伸ばさない）。
     パソコン・スマホとも縦1列で「写真 → 名前・性別・指名料（中央揃え）→ 紹介文（左揃え）→ 指名して予約する」の順。
     画面に収まる大きさにし、長いときは中をスクロールして一番下のボタンまで押せる。閉じるボタンは右上 */
  #st-detail { inset: 0; margin: auto; width: min(400px, calc(100% - 24px)); max-width: none; max-height: calc(100% - 24px); padding: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; color: var(--text); background: #fff; border: 0; border-radius: 12px; box-shadow: 0 20px 50px rgb(0 0 0 / 0.3); }
  #st-detail::backdrop { background: rgb(17 24 39 / 0.62); }
  .st-d { display: flex; flex-direction: column; }
  .st-d-close { position: sticky; top: 10px; z-index: 2; align-self: flex-end; display: grid; place-items: center; width: 36px; height: 36px; margin: 10px 10px -46px 0; padding: 0; color: #374151; font: inherit; font-size: 22px; line-height: 1; background: #fff; border: 1px solid var(--line); border-radius: 50%; box-shadow: 0 1px 4px rgb(0 0 0 / 0.12); cursor: pointer; }
  .st-d-close:focus-visible { outline: 2px solid #946328; outline-offset: 2px; }
  .st-d-photo { position: relative; flex: none; width: min(170px, 48%); aspect-ratio: 3 / 4; margin: 28px auto 0; background: #f6efe4; border-radius: 10px; overflow: hidden; }
  .st-d-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .st-d-photo svg { position: absolute; inset: 0; margin: auto; width: 46%; height: 46%; fill: #dcc69f; }
  .st-d-body { display: flex; flex-direction: column; min-width: 0; padding: 16px 20px 20px; }
  .st-d .st-head { justify-content: center; text-align: center; }
  .st-d-name { margin: 0; color: var(--text); font-size: 18px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
  .st-d .st-gender { font-size: 12px; }
  .st-d .st-fee { margin-top: 4px; text-align: center; font-size: 13px; }
  .st-d .st-fee b { font-size: 15px; }
  .st-d-msg { margin: 16px 0 0; padding-top: 14px; color: #4b5563; font-size: 13px; line-height: 1.8; text-align: left; white-space: pre-line; overflow-wrap: anywhere; border-top: 1px solid var(--line); }
  .st-d-actions { margin-top: 20px; }
  .st-d-actions .booking-button.st-book { width: 100%; min-width: 0; min-height: 48px; padding: 10px 16px; font-size: 16px; }
  @media (max-width: 767px) {
    .st-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px; }
    .st-body { padding: 10px 10px 12px; }
    .st-name { font-size: 16px; }
    .st-msg { -webkit-line-clamp: 4; }
    .booking-button.st-book { padding: 8px 10px; font-size: 14px; }
  }
</style>

<script>
(function () {
  "use strict";
  // 文言は予約サイトと同じ8か国語（共通の辞書 cn-i18n.js）。紹介文も辞書の訳を出す（訳の無い文章は日本語のまま）
  const I18N = window.CNI18N || null;
  const T = (ja) => (I18N ? I18N.t(ja) : ja);
  const esc = (t) => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const price = (n) => (I18N ? I18N.price(n) : Number(n).toLocaleString("ja-JP") + "円");
  const message = (m) => (I18N && I18N.staffMsg ? I18N.staffMsg(m) : m);
  // 写真が未登録・読み込めないときの人のマーク（ログインボタンと同じ形）
  const USER = '<svg viewBox="0 0 256 256" aria-hidden="true"><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0C63.78 166.78 40.31 185.66 25.08 212a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8ZM72 96a56 56 0 1 1 56 56 56.06 56.06 0 0 1-56-56Z"></path></svg>';
  const list = document.getElementById("st-list");
  let staff = null;
  let failed = false;

  function card(s) {
    const name = esc(s.name);
    const m = message(s.message);
    return '<article class="st-item">' +
      '<button type="button" class="st-photo" data-id="' + esc(s.id) + '" aria-label="' + name + '">' + (s.photo ? '<img src="' + esc(s.photo) + '" alt="" loading="lazy" decoding="async"/>' : USER) + "</button>" +
      '<div class="st-body">' +
      '<div class="st-head"><h3 class="st-name">' + name + "</h3></div>" +
      '<p class="st-fee">' + esc(T("指名料")) + " <b>" + esc(price(s.nominationFee)) + "</b></p>" +
      (m ? '<p class="st-msg">' + esc(m) + '</p><button type="button" class="st-more" data-id="' + esc(s.id) + '" hidden></button>' : "") +
      '<div class="st-actions"><a class="booking-button st-book" href="/book?staffId=' + encodeURIComponent(s.id) + '">' + esc(T("指名して予約する")) + "</a></div>" +
      "</div></article>";
  }

  // 紹介文が長くて途中で切れているものだけ「続きを読む」を出す（押すと、その人の情報を画面いっぱいに出す）
  function fitMore() {
    list.querySelectorAll(".st-more").forEach((b) => {
      const p = b.previousElementSibling;
      b.hidden = p.scrollHeight <= p.clientHeight + 2;
      b.textContent = T("続きを読む");
    });
  }

  // ---- 「続きを読む」・写真を押したとき：その人の情報を画面いっぱいに出す（カードは伸ばさない）----
  // スマホの「戻る」でも閉じられるよう、開いたときに履歴を1つ足す（閉じたら戻す）
  const dlg = document.createElement("dialog");
  dlg.id = "st-detail";
  dlg.setAttribute("aria-labelledby", "st-d-name");
  document.body.appendChild(dlg);
  let curId = null;
  let pushed = false;
  function renderDetail() {
    const s = staff && staff.find((x) => x.id === curId);
    if (!s) return false;
    const name = esc(s.name);
    const m = message(s.message);
    dlg.innerHTML = '<div class="st-d">' +
      '<button type="button" class="st-d-close" aria-label="' + esc(T("閉じる")) + '">×</button>' +
      '<div class="st-d-photo">' + (s.photo ? '<img src="' + esc(s.photo) + '" alt="' + name + '"/>' : USER) + "</div>" +
      '<div class="st-d-body">' +
      '<div class="st-head"><h3 id="st-d-name" class="st-d-name">' + name + "</h3></div>" +
      '<p class="st-fee">' + esc(T("指名料")) + " <b>" + esc(price(s.nominationFee)) + "</b></p>" +
      (m ? '<p class="st-d-msg">' + esc(m) + "</p>" : "") +
      '<div class="st-d-actions"><a class="booking-button st-book" href="/book?staffId=' + encodeURIComponent(s.id) + '">' + esc(T("指名して予約する")) + "</a></div>" +
      "</div></div>";
    return true;
  }
  function openDetail(id, fromHistory) {
    curId = id;
    if (!renderDetail()) { curId = null; return; }
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    document.documentElement.style.overflow = "hidden";
    if (fromHistory) pushed = true;
    else { try { history.pushState({ stDetail: id }, ""); pushed = true; } catch {} }
    dlg.querySelector(".st-d-close").focus();
  }
  dlg.addEventListener("close", () => {
    document.documentElement.style.overflow = "";
    curId = null;
    if (pushed) { pushed = false; history.back(); }
    setTimeout(reloadIfNew, 300);
  });
  // 「×」・まわりの暗いところで閉じる（Escキーでも閉じる）
  dlg.addEventListener("click", (e) => { if (e.target === dlg || e.target.closest(".st-d-close")) dlg.close(); });
  dlg.addEventListener("error", (e) => {
    const img = e.target;
    if (img && img.tagName === "IMG" && img.parentElement) img.parentElement.innerHTML = USER;
  }, true);
  window.addEventListener("popstate", () => { if (dlg.open) { pushed = false; dlg.close(); } });

  function render() {
    chrome();
    document.getElementById("st-title").textContent = T("スタッフ紹介");
    if (failed) {
      list.className = "";
      list.innerHTML = '<p class="st-status">' + esc(T("スタッフ情報を読み込めませんでした。")) + '<button type="button" id="st-retry">' + esc(T("再読み込み")) + "</button></p>";
      return;
    }
    if (!staff) return;
    if (!staff.length) {
      list.className = "";
      list.innerHTML = '<p class="st-status">' + esc(T("現在、ご指名いただけるスタッフはいません。")) + "</p>";
      return;
    }
    list.className = "st-grid";
    list.innerHTML = staff.map(card).join("");
    fitMore();
    // 開いている人の情報も最新にする（その人が指名を受け付けなくなったら閉じる）
    if (dlg.open && !renderDetail()) dlg.close();
  }

  // quiet＝開いたままのページの更新（中身が変わったときだけ描き直す。失敗しても今の表示のまま）
  let lastJson = "";
  // このページの版。書き換えられたら（詳細の画面を閉じているときに）新しい版へ読み込み直す
  let pageVer = null, newPage = false;
  const reloadIfNew = () => { if (newPage && !dlg.open && !document.hidden) location.reload(); };
  async function load(quiet) {
    try {
      const r = await fetch("/api/staff/list", { cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      if (j.page) { if (pageVer === null) pageVer = j.page; else if (j.page !== pageVer) newPage = true; }
      if (newPage) return reloadIfNew();
      const list2 = j.staff || [];
      const txt = JSON.stringify(list2);
      if (quiet && txt === lastJson) return;
      lastJson = txt;
      staff = list2;
      failed = false;
    } catch {
      if (quiet) return;
      failed = !staff;
    }
    render();
    // 予約画面から「戻る」で来たときは、見ていた人の情報を開き直す
    const hs = history.state;
    if (!quiet && staff && hs && hs.stDetail && !dlg.open) openDetail(hs.stDetail, true);
  }
  // 管理画面の「スタッフ情報」の変更は、開いたままのページにも反映する（1分ごと・画面に戻ったとき）
  setInterval(() => { if (!document.hidden) load(true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });

  list.addEventListener("click", (e) => {
    if (e.target.closest("#st-retry")) { load(); return; }
    const b = e.target.closest(".st-more, .st-photo");
    if (b) openDetail(b.dataset.id);
  });
  // 写真が読み込めなかったら人のマークにする
  list.addEventListener("error", (e) => {
    const img = e.target;
    if (img && img.tagName === "IMG" && img.parentElement) img.parentElement.innerHTML = USER;
  }, true);
  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitMore, 150); });

  // ---- ページの外枠：上部・下部のメニュー名、タイトル、言語の切り替え（予約サイトの「Language」と同じ動き・同じ保存先）----
  const KEYS = ["home", "book", "staff", "map"];
  const control = document.querySelector(".language-control");
  const langButton = control && control.querySelector(".language-button");
  let langMenu = null;
  function closeMenu() {
    if (langMenu) { langMenu.remove(); langMenu = null; }
    if (langButton) langButton.setAttribute("aria-expanded", "false");
  }
  function openMenu() {
    if (!I18N || !control) return;
    closeMenu();
    langMenu = document.createElement("div");
    langMenu.className = "language-menu";
    langMenu.setAttribute("role", "menu");
    langMenu.setAttribute("aria-label", T("言語を選択"));
    const cur = I18N.lang();
    langMenu.innerHTML = I18N.LANGS.map((l) =>
      '<button type="button" role="menuitem" data-lang="' + l + '"' + (l === cur ? ' class="selected"' : "") + "><span>" + esc(I18N.label(l)) + '</span><i aria-hidden="true">' + (l === cur ? "✓" : "") + "</i></button>").join("") +
      "<small>" + esc(T("AI翻訳")) + "</small>";
    control.appendChild(langMenu);
    langButton.setAttribute("aria-expanded", "true");
  }
  if (langButton) {
    langButton.addEventListener("click", () => (langMenu ? closeMenu() : openMenu()));
    control.addEventListener("click", (e) => {
      const b = e.target.closest("[data-lang]");
      if (!b || !I18N) return;
      closeMenu();
      I18N.set(b.dataset.lang);
    });
    document.addEventListener("mousedown", (e) => { if (langMenu && !control.contains(e.target)) closeMenu(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
  }
  function chrome() {
    if (!I18N) return;
    const l = I18N.lang();
    document.documentElement.lang = l === "zh" ? "zh-CN" : l;
    document.title = T("スタッフ紹介") + " | CN Ueno health & beauty";
    document.querySelectorAll(".desktop-nav .nav-item span").forEach((el, i) => { if (KEYS[i]) el.textContent = I18N.nav(KEYS[i]); });
    document.querySelectorAll(".mobile-nav .mobile-item small").forEach((el, i) => { if (KEYS[i]) el.textContent = I18N.nav(KEYS[i]); });
    document.querySelector(".desktop-nav")?.setAttribute("aria-label", T("メインメニュー"));
    document.querySelector(".mobile-nav")?.setAttribute("aria-label", T("モバイルメニュー"));
    if (langButton) {
      langButton.setAttribute("aria-label", T("言語を選択"));
      const b = langButton.querySelector("b");
      if (b) b.textContent = I18N.nav("language");
    }
  }
  if (I18N) I18N.onChange(() => { closeMenu(); render(); });

  render();
  load();
})();
</script>
</body></html>
