<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>マイページ | CN Ueno health & beauty</title>
<link rel="icon" href="/favicon.svg"/>
<link rel="stylesheet" href="/_next/static/css/index.BFcGkxEb.css">
<style>
  /* 予約サイトと同じトーンのマイページ（画像のレイアウトに合わせた構成） */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3f4f6;
    color: #1f2937;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
    font-size: 15px;
  }
  .tabs {
    display: flex;
    gap: 22px;
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 24px 0;
    font-weight: 600;
    color: #9ca3af;
  }
  .tabs a {
    color: inherit;
    text-decoration: none;
    padding-bottom: 8px;
    border-bottom: 2px solid transparent;
  }
  .tabs a.active { color: #b08d4f; border-bottom-color: #b08d4f; }
  main { max-width: 980px; margin: 0 auto; padding: 16px 24px 60px; }
  .card.focus { box-shadow: 0 0 0 2px #c5a15e, 0 1px 3px rgb(0 0 0 / 0.08); }
  .card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .card h2 {
    font-size: 15px;
    margin: 0;
    padding: 16px 22px;
    border-bottom: 1px solid #eceef1;
  }
  .rowline {
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 17px 22px;
    border-bottom: 1px solid #eceef1;
  }
  .rowline:last-child { border-bottom: none; }
  .rowline .k { color: #374151; font-weight: 600; min-width: 84px; }
  .badge {
    display: inline-block;
    color: #fff;
    background: #b08d4f;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 16px;
  }
  .badge.gray { background: #9ca3af; }
  .when { font-size: 17px; font-weight: 700; }
  .btnrow { display: flex; justify-content: center; padding: 18px; }
  .gold {
    font: inherit;
    background: #c5a15e;
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    padding: 12px 34px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .gold:hover { background: #b8934f; }
  .cancel {
    font: inherit;
    color: #e0483e;
    background: #fdf3f2;
    border: 1px solid #e9a29c;
    border-radius: 6px;
    font-weight: 700;
    padding: 12px 30px;
    cursor: pointer;
  }
  .cancel:hover { background: #fbe6e4; }
  .empty { color: #6b7280; padding: 26px 22px; }
  @media (max-width: 640px) {
    main { padding: 12px 12px 96px; }
    .rowline { gap: 14px; }
  }
</style>
</head>
<body>
  <header class="site-header"><div class="header-inner"><a href="/" class="brand"><img src="/images/logo.jpg.webp" alt=""/><h1>CN Ueno health & beauty</h1></a><nav class="desktop-nav" aria-label="メインメニュー"><a href="/" class="nav-item"><svg viewBox="0 0 256 256" aria-hidden="true" class="nav-icon"><path d="M218.83 103.77 138.83 28.29a16 16 0 0 0-21.64 0L37.17 103.77A16 16 0 0 0 32 115.55V208a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16v-48h32v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16v-92.45a16 16 0 0 0-5.17-11.78ZM208 208h-48v-48a16 16 0 0 0-16-16h-32a16 16 0 0 0-16 16v48H48v-92.45L128 40l80 75.53Z"></path></svg><span>ホーム</span></a><a href="/book" class="nav-item"><svg viewBox="0 0 256 256" aria-hidden="true" class="nav-icon"><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16Zm0 176H48V96h160Zm0-128H48V48h24v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24Z"></path></svg><span>予約</span></a><a href="/menus" class="nav-item"><svg viewBox="0 0 256 256" aria-hidden="true" class="nav-icon"><path d="M208 116v36a80 80 0 0 1-160 0V76a20 20 0 0 1 40 0V44a20 20 0 0 1 40 0v16a20 20 0 0 1 40 0v56a20 20 0 0 1 40 0Z" opacity=".2"></path><path d="M188 88a27.75 27.75 0 0 0-12 2.71V60a28 28 0 0 0-41.36-24.6A28 28 0 0 0 80 44v6.71A28 28 0 0 0 40 76v76a88 88 0 0 0 176 0v-36a28 28 0 0 0-28-28Zm12 64a72 72 0 0 1-144 0V76a12 12 0 0 1 24 0v44a8 8 0 0 0 16 0V44a12 12 0 0 1 24 0v68a8 8 0 0 0 16 0V60a12 12 0 0 1 24 0v68.67A48.08 48.08 0 0 0 120 176a8 8 0 0 0 16 0 32 32 0 0 1 32-32 8 8 0 0 0 8-8v-20a12 12 0 0 1 24 0Z"></path></svg><span>メニュー</span></a><a href="/map" class="nav-item"><svg viewBox="0 0 256 256" aria-hidden="true" class="nav-icon"><path d="M128 64a40 40 0 1 0 40 40 40 40 0 0 0-40-40Zm0 64a24 24 0 1 1 24-24 24 24 0 0 1-24 24Zm0-112a88.1 88.1 0 0 0-88 88c0 31.4 14.51 64.68 42 96.25a254.19 254.19 0 0 0 41.45 38.3 8 8 0 0 0 9.18 0A254.19 254.19 0 0 0 174 200.25c27.45-31.57 42-64.85 42-96.25A88.1 88.1 0 0 0 128 16Zm0 206c-16.53-13-72-60.75-72-118a72 72 0 0 1 144 0c0 57.23-55.47 105-72 118Z"></path></svg><span>マップ</span></a></nav><div class="header-actions"><a href="/login" class="login-button"><svg viewBox="0 0 256 256" aria-hidden="true" class="small-icon"><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0C63.78 166.78 40.31 185.66 25.08 212a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8ZM72 96a56 56 0 1 1 56 56 56.06 56.06 0 0 1-56-56Z"></path></svg><b>ログイン</b></a></div></div></header>
  <div class="tabs">
    <a href="#home" id="tab-home">ホーム</a>
    <a href="#resv" id="tab-resv">予約情報</a>
    <a href="#member" id="tab-member">会員情報</a>
    <a href="#tickets" id="tab-tickets">回数券</a>
  </div>
  <main id="main"></main>

<script>
(function () {
  "use strict";
  // ---- 多言語（予約時の言語で表示・取消できる） ----
  const L = {
    ja: { home: "ホーム", resv: "予約情報", member: "会員情報", booked: "予約中", cancelled: "取消済み",
      menu: "メニュー", total: "合計", cancelBtn: "予約取消", name: "お名前",
      confirm: "この予約を取り消しますか？", done: "予約を取り消しました。", fail: "取消できませんでした。時間をおいてお試しください。",
      empty: "表示できる予約がありません。予約完了ページの「マイページへ」から、このブラウザに予約が登録されます。",
      yen: (n) => n.toLocaleString("ja-JP") + "円",
      date: (d, hm) => { const [y, m, dd] = d.split("-").map(Number); const w = "日月火水木金土"[new Date(d + "T00:00:00Z").getUTCDay()]; return y + "年" + m + "月" + dd + "日（" + w + "）　" + hm; } },
    en: { home: "Home", resv: "Bookings", member: "Member info", booked: "Booked", cancelled: "Cancelled",
      menu: "Menu", total: "Total", cancelBtn: "Cancel booking", name: "Name",
      confirm: "Cancel this booking?", done: "Your booking has been cancelled.", fail: "Could not cancel. Please try again later.",
      empty: "No bookings to show. Bookings are saved to this browser from the booking-complete page.",
      yen: (n) => "¥" + n.toLocaleString("en-US"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("en-US", { weekday: "short", year: "numeric", month: "short", day: "numeric" }) + "  " + hm },
    zh: { home: "首页", resv: "预约信息", member: "会员信息", booked: "已预约", cancelled: "已取消",
      menu: "项目", total: "合计", cancelBtn: "取消预约", name: "姓名",
      confirm: "确定要取消这个预约吗？", done: "预约已取消。", fail: "取消失败，请稍后再试。",
      empty: "没有可显示的预约。预约完成页面的「我的页面」会把预约保存到本浏览器。",
      yen: (n) => "¥" + n.toLocaleString("zh-CN"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "short" }) + "  " + hm },
    ko: { home: "홈", resv: "예약 정보", member: "회원 정보", booked: "예약중", cancelled: "취소됨",
      menu: "메뉴", total: "합계", cancelBtn: "예약 취소", name: "이름",
      confirm: "이 예약을 취소하시겠습니까?", done: "예약이 취소되었습니다.", fail: "취소하지 못했습니다. 잠시 후 다시 시도해 주세요.",
      empty: "표시할 예약이 없습니다. 예약 완료 페이지의 '마이페이지'에서 이 브라우저에 저장됩니다.",
      yen: (n) => "¥" + n.toLocaleString("ko-KR"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" }) + "  " + hm },
    fr: { home: "Accueil", resv: "Réservations", member: "Infos membre", booked: "Réservé", cancelled: "Annulé",
      menu: "Soin", total: "Total", cancelBtn: "Annuler la réservation", name: "Nom",
      confirm: "Annuler cette réservation ?", done: "Votre réservation a été annulée.", fail: "Échec de l'annulation. Réessayez plus tard.",
      empty: "Aucune réservation à afficher. Les réservations sont enregistrées dans ce navigateur depuis la page de confirmation.",
      yen: (n) => "¥" + n.toLocaleString("fr-FR"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("fr-FR", { weekday: "short", year: "numeric", month: "long", day: "numeric" }) + "  " + hm },
    es: { home: "Inicio", resv: "Reservas", member: "Datos de socio", booked: "Reservado", cancelled: "Cancelado",
      menu: "Tratamiento", total: "Total", cancelBtn: "Cancelar la reserva", name: "Nombre",
      confirm: "¿Cancelar esta reserva?", done: "Su reserva ha sido cancelada.", fail: "No se pudo cancelar. Inténtelo más tarde.",
      empty: "No hay reservas que mostrar. Las reservas se guardan en este navegador desde la página de confirmación.",
      yen: (n) => "¥" + n.toLocaleString("es-ES"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("es-ES", { weekday: "short", year: "numeric", month: "long", day: "numeric" }) + "  " + hm },
    it: { home: "Home", resv: "Prenotazioni", member: "Dati socio", booked: "Prenotato", cancelled: "Annullato",
      menu: "Trattamento", total: "Totale", cancelBtn: "Annulla la prenotazione", name: "Nome",
      confirm: "Annullare questa prenotazione?", done: "La prenotazione è stata annullata.", fail: "Impossibile annullare. Riprova più tardi.",
      empty: "Nessuna prenotazione da mostrare. Le prenotazioni vengono salvate in questo browser dalla pagina di conferma.",
      yen: (n) => "¥" + n.toLocaleString("it-IT"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("it-IT", { weekday: "short", year: "numeric", month: "long", day: "numeric" }) + "  " + hm },
    de: { home: "Start", resv: "Reservierungen", member: "Mitgliedsdaten", booked: "Reserviert", cancelled: "Storniert",
      menu: "Behandlung", total: "Gesamt", cancelBtn: "Reservierung stornieren", name: "Name",
      confirm: "Diese Reservierung stornieren?", done: "Ihre Reservierung wurde storniert.", fail: "Stornierung fehlgeschlagen. Bitte später erneut versuchen.",
      empty: "Keine Reservierungen vorhanden. Reservierungen werden über die Bestätigungsseite in diesem Browser gespeichert.",
      yen: (n) => "¥" + n.toLocaleString("de-DE"),
      date: (d, hm) => new Date(d + "T00:00:00+09:00").toLocaleDateString("de-DE", { weekday: "short", year: "numeric", month: "long", day: "numeric" }) + "  " + hm },
  };
  const norm = (l) => (String(l || "").toLowerCase().startsWith("zh") ? "zh" : ["en", "ko", "zh", "ja", "fr", "es", "it", "de"].includes(String(l || "").slice(0, 2)) ? String(l).slice(0, 2) : "ja");
  const q = new URLSearchParams(location.search);
  let pageLang = norm(q.get("lang") || localStorage.getItem("fm-lang") || "ja");
  const T = () => L[pageLang] || L.ja;

  const MYKEY = "cn-mypage";
  const store = () => { try { return JSON.parse(localStorage.getItem(MYKEY) || "[]"); } catch { return []; } };
  const saveStore = (list) => { try { localStorage.setItem(MYKEY, JSON.stringify(list.slice(-20))); } catch {} };
  // 回数券（購入時に発行されるid+tokenの組。表示内容は毎回サーバーから取得する）
  const TKKEY = "cn-tickets";
  const tkStore = () => { try { return JSON.parse(localStorage.getItem(TKKEY) || "[]"); } catch { return []; } };
  const tkSave = (list) => { try { localStorage.setItem(TKKEY, JSON.stringify(list.slice(-30))); } catch {} };

  // メールの取消リンク（/mypage?id=..&token=..）から来た場合は登録して表示
  if (q.get("id") && q.get("token")) {
    const list = store().filter((x) => x.id !== q.get("id"));
    list.push({ id: q.get("id"), token: q.get("token"), name: "", lang: pageLang });
    saveStore(list);
  }
  // メールのリンク（?tab=tickets 等）で開くタブを指定できる。予約の合言葉はアドレス欄に残さない。
  // 予約メールの「予約のキャンセルはこちら」（?id=…&token=…）は、予約情報タブのその予約へ直接移動する
  const focusId = q.get("id") && q.get("token") ? q.get("id") : "";
  {
    const tabQ = q.get("tab") || (focusId ? "resv" : "");
    if (q.get("token") || tabQ) {
      const want = ["home", "resv", "member", "tickets"].includes(tabQ) ? "#" + tabQ : location.hash;
      try { history.replaceState(null, "", location.pathname + (q.get("lang") ? "?lang=" + encodeURIComponent(q.get("lang")) : "") + want); } catch {}
    }
  }

  const hm = (ms) => {
    const d = new Date(ms + 9 * 3600e3);
    return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0");
  };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let rows = []; // {entry, bk}
  let myTickets = [];
  let ticketPlans = [];
  // 会員（ログイン中のお客様）。マイページはログイン必須：予約の変更・取消、回数券の購入・残数確認は
  // すべてログインした本人だけができる（本人確認はサーバー側 /api/member/*）
  let member = null;
  let memberData = null;
  async function loadMember() {
    member = null; memberData = null;
    try {
      const r = await fetch("/api/member/me", { cache: "no-store", credentials: "same-origin" });
      if (r.ok) { memberData = await r.json(); member = memberData.member; }
    } catch {}
  }
  async function loadTickets() {
    myTickets = [];
    try {
      // 本人の回数券はサーバーから直接。加えて、このブラウザに記録された券（ログイン前の購入分）も表示
      if (memberData) myTickets = memberData.tickets || [];
      const items = tkStore().filter((it) => !myTickets.some((t) => t.id === it.id));
      if (items.length) {
        const r = await fetch("/api/tickets/mine", { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items }), cache: "no-store" });
        myTickets = [...myTickets, ...((await r.json()).tickets || [])];
      }
    } catch {}
    try {
      ticketPlans = (memberData && memberData.plans) ||
        (await (await fetch("/api/tickets/plans", { cache: "no-store" })).json()).plans || [];
    } catch {}
  }
  async function loadAll() {
    await loadMember();
    rows = [];
    if (!member) {
      // 未ログインでも、予約メールのリンク（予約ID＋予約ごとの合言葉）で開いた予約だけは表示する
      // （確認・取消のみ。日時変更・回数券・会員情報はログインが必要）
      for (const entry of store()) {
        try {
          const r = await fetch("/api/bookings?id=" + encodeURIComponent(entry.id), {
            headers: { Authorization: "Bearer " + entry.token }, cache: "no-store" });
          if (r.ok) rows.push({ entry, bk: (await r.json()).booking });
        } catch {}
      }
      rows.sort((a, b) => b.bk.start - a.bk.start);
      return;
    }
    await loadTickets();
    // 本人の予約（会員に紐付いた予約）＋このブラウザに記録された予約（ログイン前の分）
    for (const bk of memberData.bookings || []) rows.push({ entry: { id: bk.id, token: bk.token, name: bk.name }, bk });
    for (const entry of store()) {
      if (rows.some((r) => r.entry.id === entry.id)) continue;
      try {
        const r = await fetch("/api/bookings?id=" + encodeURIComponent(entry.id), {
          headers: { Authorization: "Bearer " + entry.token }, cache: "no-store", credentials: "same-origin" });
        if (!r.ok) continue;
        const j = await r.json();
        rows.push({ entry, bk: j.booking });
      } catch {}
    }
    rows.sort((a, b) => b.bk.start - a.bk.start);
    if (!q.get("lang") && rows[0]) pageLang = norm(localStorage.getItem("fm-lang") || rows[0].bk.language);
  }
  const changeLabel = () => ({ ja: "日時を変更", en: "Change date/time" }[pageLang] || "日時を変更");
  function loginGate() {
    const ja = pageLang !== "en";
    return '<div class="card"><h2>' + (ja ? "マイページ" : "My page") + "</h2>" +
      '<p class="empty" style="margin:0 0 12px">' +
      (ja ? "マイページのご利用にはログインが必要です。<br>ご予約の確認・日時変更・取消、回数券のご購入・残り回数の確認ができます。<br>はじめての方は「新規会員登録（無料）」からご登録ください。"
          : "Please log in to use My page. You can check, reschedule or cancel bookings and buy or check tickets.<br>New here? Please create a free account.") +
      "</p>" +
      '<div class="btnrow"><button type="button" class="gold" style="border:0;cursor:pointer" id="mp-login">' + (ja ? "ログイン" : "Log in") + "</button>" +
      '<button type="button" class="gold" style="border:1px solid #c5a15e;background:#fff;color:#8a6a33;cursor:pointer" id="mp-register">' + (ja ? "新規会員登録（無料）" : "Sign up (free)") + "</button></div></div>";
  }

  // メールの「予約のキャンセルはこちら」から開いた予約を一番上に並べる
  const focusFirst = (list) => focusId ? [...list.filter((r) => r.entry.id === focusId), ...list.filter((r) => r.entry.id !== focusId)] : list;
  function bookingCard(row, withButtons) {
    const t = L[norm(row.bk.language)] || T();
    const cancelled = row.bk.status !== "confirmed";
    return '<div class="card' + (row.entry.id === focusId ? " focus" : "") + '" data-id="' + esc(row.entry.id) + '">' +
      '<div class="rowline"><span class="badge' + (cancelled ? " gray" : "") + '">' + (cancelled ? t.cancelled : t.booked) + "</span>" +
      '<span class="when">' + t.date(row.bk.serviceDate, hm(row.bk.start)) + "</span></div>" +
      '<div class="rowline"><span class="k">' + t.menu + "</span><span>" + esc(row.bk.courseName) + "</span></div>" +
      '<div class="rowline"><span class="k">' + t.total + "</span><span>" + t.yen(row.bk.total) + "</span></div>" +
      (row.bk.ticket_name
        ? '<div class="rowline"><span class="k">回数券</span><span>' + esc(row.bk.ticket_name) + "（残り " + (row.bk.ticket_left_after ?? "-") + "回）</span></div>"
        : "") +
      (withButtons && !cancelled && row.bk.start > Date.now()
        ? '<div class="btnrow">' +
          (member && /^[\w-]+$/.test(String(row.bk.courseId || ""))
            ? '<a class="gold" href="/book/select-datetime/' + esc(row.bk.courseId) + "?reschedule=" + encodeURIComponent(row.entry.id) + '">' + changeLabel() + "</a>"
            : "") +
          '<button type="button" class="cancel" data-cancel="' + esc(row.entry.id) + '">' + t.cancelBtn + "</button></div>"
        : "") +
      "</div>";
  }

  function render() {
    const t = T();
    document.getElementById("tab-home").textContent = t.home;
    document.getElementById("tab-resv").textContent = t.resv;
    document.getElementById("tab-member").textContent = t.member;
    document.getElementById("tab-tickets").textContent = pageLang === "en" ? "Tickets" : "回数券";
    const tab = (location.hash || "#home").slice(1);
    for (const id of ["home", "resv", "member", "tickets"]) {
      document.getElementById("tab-" + id).classList.toggle("active", tab === id);
    }
    const main = document.getElementById("main");
    if (!member) {
      if (!rows.length || tab === "member" || tab === "tickets") {
        main.innerHTML = loginGate();
        return;
      }
      // メールのリンクから開いた予約（ログイン不要で確認・取消できる）＋ログインの案内
      main.innerHTML = focusFirst(rows).map((r) => bookingCard(r, true)).join("") + loginGate();
      return;
    }
    const name = member.name || store().map((x) => x.name).filter(Boolean).pop() || "";
    if (tab === "tickets") {
      main.innerHTML = ticketsView();
      return;
    }
    if (tab === "member") {
      main.innerHTML = memberView(name);
      return;
    }
    if (!rows.length) {
      main.innerHTML = '<div class="card"><p class="empty">' + t.empty + "</p></div>";
      return;
    }
    if (tab === "home") {
      const latest = rows.find((r) => r.bk.status === "confirmed") || rows[0];
      main.innerHTML =
        '<div class="card"><h2>' + t.resv + "</h2>" +
        (latest
          ? bookingCard(latest, false).replace('<div class="card"', '<div class="card" style="box-shadow:none;margin:0"') +
            '<div class="btnrow"><a class="gold" href="#resv">' + t.resv + "</a></div>"
          : '<p class="empty">' + t.empty + "</p>") +
        "</div>" +
        '<div class="card"><h2>' + t.member + "</h2>" +
        '<div class="rowline"><span class="k">' + t.name + "</span><span>" + esc(name) + "</span></div>" +
        '<div class="btnrow"><a class="gold" href="#member">' + t.member + "</a></div></div>" +
        '<div class="card"><h2>回数券</h2>' +
        (myTickets.length
          ? myTickets.map((tk) => '<div class="rowline"><span class="k">' + esc(tk.plan_name) + '</span><span>残り ' + tk.uses_left + "回</span></div>").join("")
          : '<p class="empty">お得な回数券をご用意しています。</p>') +
        '<div class="btnrow"><a class="gold" href="#tickets">回数券を見る</a></div></div>';
    } else if (tab === "resv") {
      main.innerHTML = focusFirst(rows).map((r) => bookingCard(r, true)).join("");
    }
  }

  // 会員情報タブ：登録メール・お名前・電話番号の確認と変更、パスワード変更、ログアウト
  function memberView(name) {
    const t = T();
    const ja = pageLang !== "en";
    const inp = 'style="width:100%;box-sizing:border-box;border:1px solid #cfcfcf;border-radius:6px;padding:10px 12px;font-size:15px;margin:4px 0 10px"';
    return '<div class="card"><h2>' + t.member + "</h2>" +
      '<div class="rowline"><span class="k">' + (ja ? "メールアドレス（ログインID）" : "Email (login ID)") + "</span><span>" + esc(member.email) + "</span></div>" +
      '<div class="rowline"><span class="k">' + t.name + "</span><span>" + esc(name) + "</span></div>" +
      '<div class="rowline"><span class="k">' + (ja ? "電話番号" : "Phone") + "</span><span>" + esc(member.phone || "") + "</span></div>" +
      "</div>" +
      '<div class="card"><h2>' + (ja ? "会員情報の変更" : "Edit member info") + "</h2>" +
      '<form id="mp-profile">' +
      "<label>" + t.name + '<input name="name" ' + inp + ' value="' + esc(member.name || "") + '"></label>' +
      "<label>" + (ja ? "電話番号" : "Phone") + '<input name="phone" ' + inp + ' value="' + esc(member.phone || "") + '"></label>' +
      '<div class="btnrow"><button type="submit" class="gold" style="border:0;cursor:pointer">' + (ja ? "保存する" : "Save") + "</button></div>" +
      "</form></div>" +
      '<div class="card"><h2>' + (ja ? "パスワードの変更" : "Change password") + "</h2>" +
      '<form id="mp-pass">' +
      "<label>" + (ja ? "現在のパスワード" : "Current password") + '<input name="pass" type="password" ' + inp + "></label>" +
      "<label>" + (ja ? "新しいパスワード（6文字以上）" : "New password (6+ characters)") + '<input name="newPass" type="password" ' + inp + "></label>" +
      '<div class="btnrow"><button type="submit" class="gold" style="border:0;cursor:pointer">' + (ja ? "変更する" : "Change") + "</button></div>" +
      "</form></div>" +
      '<div class="card"><div class="btnrow"><button type="button" class="cancel" id="mp-logout">' + (ja ? "ログアウト" : "Log out") + "</button></div></div>";
  }

  const jd = (iso) => String(iso || "").slice(0, 10);
  function ticketsView() {
    const own = myTickets.map((tk) => {
      const stCls = tk.status === "有効" ? "" : " gray";
      return '<div class="card">' +
        '<div class="rowline"><span class="badge' + stCls + '">' + esc(tk.status) + '</span><span class="when">' + esc(tk.plan_name) + "</span></div>" +
        '<div class="rowline"><span class="k">購入日</span><span>' + jd(tk.purchased_at) + "</span></div>" +
        '<div class="rowline"><span class="k">利用可能回数</span><span>' + tk.uses_total + "回</span></div>" +
        '<div class="rowline"><span class="k">残り回数</span><span><b style="font-size:16px">' + tk.uses_left + '回</b>（利用済み ' + tk.used + "回）</span></div>" +
        '<div class="rowline"><span class="k">有効期限</span><span>' + (tk.expires_label || jd(new Date(tk.expires_at + 9 * 3600e3).toISOString())) + "</span></div>" +
        "</div>";
    }).join("");
    const plans = ticketPlans.map((pl) =>
      '<div class="card">' +
      '<div class="rowline"><span class="when">' + esc(pl.name) + '</span><span><b>' + pl.price.toLocaleString("ja-JP") + "円</b></span></div>" +
      '<div class="rowline"><span class="k">' + pl.uses + "回分／有効期限は購入日から1年間</span></div>" +
      '<p class="empty" style="margin:6px 0">' + esc(pl.description || "") + "</p>" +
      '<div class="btnrow"><button type="button" class="gold" style="border:0;cursor:pointer" data-buy="' + esc(pl.id) + '">この回数券を購入</button></div>' +
      "</div>").join("");
    // ログイン中の会員だけが購入できる（判定はサーバー側でも必ず行う）
    if (!member) return loginGate();
    return '<div class="card"><h2>保有中の回数券</h2>' +
      (own || '<p class="empty">保有中の回数券はありません。</p>') + "</div>" +
      '<div class="card"><h2>回数券のご購入</h2>' +
      '<p class="empty" style="margin:0 0 8px">お支払いは店頭にて承ります。ご予約時に「回数券を使用する」を選ぶと、1回のご予約で1回分を使用します。有効期限はどの券も購入日から1年間です。</p>' +
      (plans || '<p class="empty">現在販売中の回数券はありません。</p>') + "</div>";
  }

  // 会員情報・パスワードの変更（フォーム送信）
  document.addEventListener("submit", async (e) => {
    const f = e.target;
    if (f.id !== "mp-profile" && f.id !== "mp-pass") return;
    e.preventDefault();
    const ja = pageLang !== "en";
    const body = f.id === "mp-profile"
      ? { name: f.name.value, phone: f.phone.value }
      : { pass: f.pass.value, newPass: f.newPass.value };
    if (f.id === "mp-pass" && String(body.newPass || "").trim().length < 6) {
      window.alert(ja ? "新しいパスワードは6文字以上で入力してください。" : "New password must be at least 6 characters.");
      return;
    }
    try {
      const r = await fetch("/api/member/profile", { method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        window.alert(j.error === "invalidLogin" ? (ja ? "現在のパスワードが違います。" : "Current password is incorrect.")
          : (ja ? "保存できませんでした。" : "Could not save."));
        return;
      }
      window.alert(ja ? "保存しました。" : "Saved.");
    } catch {
      window.alert(ja ? "保存できませんでした。" : "Could not save.");
      return;
    }
    await loadAll();
    render();
  });

  document.addEventListener("click", async (e) => {
    if (e.target.closest("#mp-register")) {
      if (window.CNMember) window.CNMember.open("register"); else location.href = "/login?register=1";
      return;
    }
    if (e.target.closest("#mp-login")) {
      if (window.CNMember) window.CNMember.open("login"); else location.href = "/login";
      return;
    }
    if (e.target.closest("#mp-logout")) {
      if (window.CNMember) window.CNMember.logout();
      else { try { await fetch("/api/member/logout", { method: "POST", credentials: "same-origin" }); } catch {} location.href = "/"; }
      return;
    }
    const buyId = e.target.closest("[data-buy]")?.dataset.buy;
    if (buyId) {
      if (!member) { if (window.CNMember) window.CNMember.open(); return; }
      const pl = ticketPlans.find((p) => p.id === buyId);
      if (!window.confirm((pl ? pl.name + "（" + pl.uses + "回分・" + pl.price.toLocaleString("ja-JP") + "円）" : "この回数券") +
        "を購入します。よろしいですか？\nお支払いは店頭にて承ります。")) return;
      // ログイン中は会員情報のメールアドレスで購入（入力不要）。お名前が未登録のときだけ確認する
      let nm = member.name || "";
      if (!nm) { nm = window.prompt("お名前を入力してください", "") || ""; if (!nm.trim()) return; }
      try {
        const r = await fetch("/api/tickets/purchase", { method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ planId: buyId, name: nm.trim() }) });
        const j = await r.json();
        if (!r.ok || !j.ok) {
          if (j.error === "memberOnly") {
            window.alert("回数券のご購入にはログインが必要です。");
            return;
          }
          throw new Error(j.error || "purchase");
        }
        tkSave([...tkStore(), { id: j.ticket.id, token: j.ticket.token }]);
        window.alert("回数券を購入しました。お支払いは店頭にて承ります。\n残り回数：" + j.ticket.uses_left + "回");
      } catch {
        window.alert("購入できませんでした。入力内容をご確認ください。");
        return;
      }
      await loadTickets();
      render();
      return;
    }
    const id = e.target.closest("[data-cancel]")?.dataset.cancel;
    if (!id) return;
    const row = rows.find((r) => r.entry.id === id);
    if (!row) return;
    const t = L[norm(row.bk.language)] || T(); // 予約したときの言語で確認・完了を表示
    if (!window.confirm(t.confirm)) return;
    try {
      const r = await fetch("/api/bookings/cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + row.entry.token },
        body: JSON.stringify({ id }),
      });
      if (!r.ok) throw new Error("cancel");
      window.alert(t.done);
    } catch {
      window.alert(t.fail);
      return;
    }
    await loadAll();
    render();
  });
  window.addEventListener("hashchange", render);

  loadAll().then(() => {
    render();
    // メールのリンクで開いた予約まで画面を移動する
    const el = focusId && document.querySelector('.card.focus');
    if (el) try { el.scrollIntoView({ block: "center" }); } catch {}
  });
})();
</script>
