<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>メール管理（デモ） | CNsalon@board</title>
<link rel="icon" href="/favicon.svg"/>
<style>
  /* 管理画面（PeakManager系）と同じ配色のメールボックス */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #eee6e0;
    color: #292929;
    font-family: Arial, "Noto Sans JP", sans-serif;
    font-size: 13px;
  }
  header {
    background: #987050;
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header b { font-size: 15px; }
  header a {
    color: #fff;
    text-decoration: none;
    border: 1px solid rgb(255 255 255 / 0.6);
    border-radius: 3px;
    padding: 4px 10px;
    font-size: 12px;
  }
  header a:hover { background: rgb(255 255 255 / 0.15); }
  .note {
    margin: 10px 16px 0;
    background: #fdf3d7;
    border: 1px solid #e6c96a;
    color: #7a5a12;
    border-radius: 3px;
    padding: 7px 12px;
  }
  .tabs { display: flex; gap: 6px; margin: 12px 16px 0; }
  .tabs button {
    font: inherit;
    background: #fff;
    border: 1px solid #c6b9ad;
    border-radius: 3px;
    padding: 6px 16px;
    cursor: pointer;
  }
  .tabs button.on {
    background: #4d4d4d;
    border-color: #4d4d4d;
    color: #fff;
  }
  main { padding: 12px 16px 40px; }
  .mail {
    background: #fff;
    border: 1px solid #c6b9ad;
    border-radius: 3px;
    margin-bottom: 10px;
  }
  .mail summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    flex-wrap: wrap;
  }
  .mail summary::-webkit-details-marker { display: none; }
  .badge {
    color: #fff;
    font-size: 11px;
    border-radius: 2px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .b-confirm { background: #3f9b45; }
  .b-notify  { background: #609cef; }
  .b-remind  { background: #e6a35f; }
  .b-change  { background: #987050; }
  .b-cancel  { background: #e9625b; }
  .kind {
    border: 1px solid #c6b9ad;
    border-radius: 2px;
    color: #6b5b4b;
    font-size: 11px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  .subject { font-weight: 700; flex: 1; min-width: 240px; }
  .meta { color: #8d8d8d; font-size: 12px; white-space: nowrap; }
  .status-pending { color: #b06a00; font-weight: 700; }
  .status-sending { color: #2a6fb0; font-weight: 700; }
  .status-accepted { color: #3f9b45; font-weight: 700; }
  .note.warn { background: #fdecea; border-color: #e4a29b; color: #8a2a20; line-height: 1.7; }
  .note code { background: rgb(0 0 0 / 0.06); padding: 0 4px; border-radius: 3px; }
  .status-failed { color: #c0392b; font-weight: 700; }
  .status-skipped { color: #7a7a7a; font-weight: 700; }
  .b-ticket { background: #b07cc6; }
  .b-ticketRemind { background: #c27a2c; }
  .b-member { background: #6f8f8a; }
  /* 送信時点の回数券情報（メール本文に載せた値＝この時点のデータベースの値） */
  .tksnap { background: #faf6f0; border: 1px solid #eee3d5; border-radius: 6px; padding: 8px 12px; margin: 6px 0 10px; font-size: 13px; line-height: 1.8; }
  .tksnap b { color: #6b4f2a; }
  .tksnap .note { color: #8d8d8d; font-size: 12px; }
  .mail-error { color: #c0392b; margin: 6px 0 0; }
  button.resend { font: inherit; font-size: 12px; background: #fff; border: 1px solid #c0392b; color: #c0392b; border-radius: 3px; padding: 4px 12px; cursor: pointer; }
  .mailbody {
    border-top: 1px dashed #c6b9ad;
    margin: 0 12px;
    padding: 10px 2px 14px;
  }
  .mailbody .to { color: #8d8d8d; margin-bottom: 8px; }
  pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font: inherit;
    line-height: 1.8;
  }
  /* 実際に届くHTMLメールのプレビュー */
  .mailframe {
    display: block;
    width: 100%;
    max-width: 640px;
    height: 420px;
    border: 1px solid #e0d6cb;
    border-radius: 3px;
    background: #fff;
  }
  .rawtext { margin-top: 8px; }
  .rawtext summary {
    color: #8d8d8d;
    font-size: 12px;
    cursor: pointer;
    list-style: none;
  }
  .rawtext summary::-webkit-details-marker { display: none; }
  .rawtext pre {
    background: #faf7f4;
    border: 1px dashed #d9cbbd;
    border-radius: 3px;
    padding: 8px 10px;
    margin-top: 6px;
  }
  .empty { color: #8d8d8d; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
  <header>
    <b>メール管理</b>
    <a href="/admin">← 予約台帳へ戻る</a>
    <a href="/admin/mail-setup">メール送信設定</a>
    <a href="/" target="_blank">予約サイトを開く</a>
  </header>
  <p class="note" id="deliveryNote">送信設定を確認しています…</p>
  <div class="tabs">
    <button data-f="all" class="on">すべて</button>
    <button data-f="customer">お客様宛</button>
    <button data-f="store">店舗（管理者）宛</button>
  </div>
  <main id="list"><p class="empty">読み込み中…</p></main>

<script>
(function () {
  "use strict";
  const TYPE = {
    confirm: ["予約完了", "b-confirm"],
    notify:  ["新規予約通知", "b-notify"],
    remind:  ["リマインド", "b-remind"],
    change:  ["変更通知", "b-change"],
    cancel:  ["取消通知", "b-cancel"],
    ticket:  ["回数券", "b-ticket"],
    ticketRemind: ["回数券期限", "b-ticketRemind"],
    member:  ["会員", "b-member"],
  };
  // 回数券を含むメール：送信時点（本文を作った時点）の回数券の状態を表示する
  function ticketSnapHtml(m) {
    if (m.ticketSnap && m.ticketSnap.length) {
      return '<div class="tksnap"><b>送信時点の回数券情報</b>（' + fmt(m.renderedAt) + ' にデータベースから取得してメール本文に掲載）<br>' +
        m.ticketSnap.map((s) => esc(s.planName) + '（' + esc(s.ticketId) + '）　残り ' + s.usesLeft + '回／' + s.usesTotal + '回　有効期限 ' +
          esc(s.expiresLabel) + '　' + esc(s.status)).join("<br>") + "</div>";
    }
    if (m.tpl && m.status === "pending") {
      return '<div class="tksnap"><span class="note">回数券の残り回数・有効期限は、送信予定時刻にデータベースの最新の値で本文を作り直して送ります（下のプレビューは現時点の内容です）。</span></div>';
    }
    return "";
  }
  let filter = "all";
  let mails = [];
  const opened = new Set();

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const escAttr = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const fmt = (t) => new Date(t).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

  function render() {
    const list = document.getElementById("list");
    const rows = mails.filter((m) => filter === "all" || m.kind === filter);
    if (!rows.length) {
      list.innerHTML = '<p class="empty">メールはまだありません。予約サイトから予約すると、完了メール・通知・リマインドがここに届きます。</p>';
      return;
    }
    list.innerHTML = rows.map((m) => {
      const [label0, cls] = TYPE[m.type] || [m.type, "b-notify"];
      const d0 = m.type === "ticketRemind" && m.tpl ? (m.tpl.days || 30) : 0;
      const label = label0 + (d0 ? "（" + (d0 === 1 ? "前日" : d0 + "日前") + "）" : "");
      const stat = m.status === "sent"
        ? (m.real
          ? '<span class="status-accepted">送信済み</span> ' + fmt(m.sentAt || m.scheduledAt)
          : '<span class="status-skipped">記録のみ（実際には届いていません）</span> ' + fmt(m.sentAt || m.scheduledAt))
        : m.status === "failed"
        ? '<span class="status-failed">送信失敗</span> ' + fmt(m.scheduledAt)
        : m.status === "skipped"
        ? '<span class="status-skipped">送信中止</span> ' + fmt(m.scheduledAt)
        : m.status === "sending"
        ? '<span class="status-sending">送信処理中</span> ' + fmt(m.scheduledAt)
        : '<span class="status-pending">送信予定</span> ' + fmt(m.scheduledAt);
      return `<details class="mail" data-id="${m.id}" ${opened.has(m.id) ? "open" : ""}>
        <summary>
          <span class="badge ${cls}">${label}</span>
          <span class="kind">${m.kind === "customer" ? "お客様宛" : "店舗宛"}</span>
          <span class="subject">${esc(m.subject)}</span>
          <span class="meta">${stat}</span>
        </summary>
        <div class="mailbody">
          <p class="to">宛先：${esc(m.to)}</p>
          ${m.error ? '<p class="mail-error">エラー：' + esc(m.error) + "</p>" : ""}
          ${m.status === "failed" && !(m.resentAs || []).length && m.type !== "member" ? '<p><button type="button" class="resend" data-resend="' + m.id + '">再送する</button></p>' : ""}
          ${(m.resentAs || []).length ? '<p class="to">再送済み（' + esc(m.resentAs.join("・")) + "）</p>" : ""}
          ${m.resendOf ? '<p class="to">' + esc(m.resendOf) + " の再送</p>" : ""}
          ${m.skipReason ? '<p class="mail-error" style="color:#7a7a7a">送信中止の理由：' + esc(m.skipReason) + "</p>" : ""}
          ${ticketSnapHtml(m)}
          ${m.html
            ? `<iframe class="mailframe" title="メールプレビュー" srcdoc="${escAttr(m.html)}"></iframe>
               <details class="rawtext"><summary>▸ テキスト版を表示</summary><pre>${esc(m.body)}</pre></details>`
            : `<pre>${esc(m.body)}</pre>`}
        </div>
      </details>`;
    }).join("");
    list.querySelectorAll("details.mail").forEach((d) => {
      d.addEventListener("toggle", () => {
        if (d.open) opened.add(d.dataset.id); else opened.delete(d.dataset.id);
      });
    });
    // プレビューの高さをメール本文に合わせる
    list.querySelectorAll(".mailframe").forEach((fr) => {
      fr.addEventListener("load", () => {
        try {
          const h = fr.contentDocument?.body?.scrollHeight;
          if (h) fr.style.height = Math.min(h + 24, 1200) + "px";
        } catch {}
      });
    });
  }

  // 送信失敗のメールを再送（1通につき1回。送信直前に最新の内容を確認し、送る意味がなければ中止）
  document.getElementById("list").addEventListener("click", async (e) => {
    const id = e.target.dataset && e.target.dataset.resend;
    if (!id) return;
    e.preventDefault();
    if (!window.confirm("このメールを再送しますか？")) return;
    e.target.disabled = true;
    const r = await fetch("/api/demo/mails", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "resend", id }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) window.alert({ alreadyResent: "このメールはすでに再送しています。", notFailed: "送信失敗のメールだけ再送できます。", hasSecret: "パスワードを含むメールは再送できません。" }[j.error] || "再送できませんでした（マネージャー以上の権限が必要です）。");
    load();
  });

  document.querySelectorAll(".tabs button").forEach((b) => {
    b.addEventListener("click", () => {
      filter = b.dataset.f;
      document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
      render();
    });
  });

  async function load() {
    try {
      const r = await fetch("/api/demo/mails", { cache: "no-store" });
      const j = await r.json();
      mails = j.mails || [];
      // 送信設定の状態：未設定なら、お客様にも店舗にもメールが届いていないことをはっきり示す
      const dv = j.delivery || {};
      const note = document.getElementById("deliveryNote");
      if (!dv.configured) {
        note.className = "note warn";
        note.innerHTML = "<b>⚠ メール送信の設定がないため、お客様・店舗のどちらにもメールは実際には届いていません。</b><br>" +
          "ここには送る予定だった内容が「記録のみ」として残っています。<a href=\"/admin/mail-setup\">メール送信設定</a> の手順で設定すると、実際に送信されるようになります。" +
          "<br>店舗宛ての通知先：" + esc(dv.storeMail || "") + "（店舗情報のメールアドレス）";
      } else if (dv.via === "smtp" && mails.some((m) => m.status === "failed" && /接続できませんでした/.test(m.error || ""))) {
        note.className = "note warn";
        note.innerHTML = "<b>⚠ メールの送信に失敗しています（お客様・店舗のどちらにも届いていません）。</b><br>" +
          "Render の無料プランは Gmail への直接送信を止めています。<a href=\"/admin/mail-setup\">メール送信設定</a> の手順（約10分・無料）で、Googleの送信中継を登録してください。";
      } else if (!dv.allowAll) {
        note.className = "note warn";
        note.innerHTML = "<b>⚠ テスト用の設定です。許可した宛先（" + (dv.allowTo || 0) + "件）にだけ実際に送信し、お客様には届きません。</b><br>" +
          "お客様にも送るには Render の Environment に <code>MAIL_SEND_TO_ALL=1</code> を設定してください。店舗宛ての通知先：" + esc(dv.storeMail || "");
      } else {
        note.className = "note";
        note.innerHTML = "メールは実際に送信されています。送信状態（送信予定→送信処理中→送信済み／送信失敗）を確認できます。リマインドは「お客様＝来店24時間前」「店舗＝当日朝9時」に送信されます。店舗宛ての通知先：" + esc(dv.storeMail || "");
      }
      render();
    } catch {}
  }
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
